<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Makar Sankranti - Somatiq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 40%, #0a0a0a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100vh;
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.08) 0%, rgba(0, 0, 0, 0.6) 100%);
      padding: 60px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }


    /* Floating decorative elements */
    .decoration {
      position: absolute;
      opacity: 0.6;
      animation: float 6s ease-in-out infinite;
    }

    .kite {
      font-size: 32px;
    }

    .kite-1 { top: 10%; left: 8%; animation-delay: 0s; }
    .kite-2 { top: 15%; right: 10%; animation-delay: 1s; transform: rotate(15deg); }
    .kite-3 { bottom: 20%; left: 5%; animation-delay: 2s; transform: rotate(-10deg); }
    .kite-4 { bottom: 15%; right: 8%; animation-delay: 0.5s; }

    /* Natural Sun - layered organic glow */
    .sun-container {
      position: absolute;
      top: -12%;
      right: -15%;
      width: 500px;
      height: 500px;
      z-index: 1;
    }

    /* Atmospheric haze - outermost soft glow */
    .sun-haze {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(ellipse 100% 120% at center,
        rgba(255, 180, 80, 0.12) 0%,
        rgba(255, 140, 50, 0.06) 30%,
        rgba(255, 100, 30, 0.02) 60%,
        transparent 100%);
      filter: blur(40px);
      animation: hazeBreath 8s ease-in-out infinite;
    }

    /* Warm atmospheric scatter */
    .sun-scatter {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      background:
        radial-gradient(ellipse 80% 100% at 40% 50%,
          rgba(255, 200, 100, 0.2) 0%,
          rgba(255, 160, 60, 0.1) 40%,
          transparent 70%),
        radial-gradient(ellipse 100% 80% at 60% 40%,
          rgba(255, 220, 150, 0.15) 0%,
          transparent 60%);
      filter: blur(25px);
      animation: scatterPulse 6s ease-in-out infinite;
    }

    /* Corona - soft outer ring */
    .sun-corona {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle,
        rgba(255, 230, 180, 0.4) 0%,
        rgba(255, 200, 120, 0.3) 30%,
        rgba(255, 170, 80, 0.15) 55%,
        rgba(255, 140, 50, 0.05) 75%,
        transparent 100%);
      filter: blur(15px);
      animation: coronaPulse 5s ease-in-out infinite;
    }

    /* Photosphere - main body */
    .sun-body {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      background: radial-gradient(circle at 35% 35%,
        #FFFEF5 0%,
        #FFF9E6 15%,
        #FFECB3 35%,
        #FFD54F 55%,
        #FFB300 75%,
        #FF8F00 100%);
      border-radius: 50%;
      box-shadow:
        0 0 15px rgba(255, 250, 220, 0.95),
        0 0 35px rgba(255, 230, 150, 0.7),
        0 0 70px rgba(255, 200, 100, 0.5),
        0 0 110px rgba(255, 160, 60, 0.35),
        0 0 160px rgba(255, 120, 30, 0.2);
      animation: bodyGlow 4s ease-in-out infinite;
    }

    /* Surface texture overlay */
    .sun-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4) 0%, transparent 25%),
        radial-gradient(circle at 70% 60%, rgba(255,200,100,0.2) 0%, transparent 30%),
        radial-gradient(circle at 45% 75%, rgba(255,180,80,0.15) 0%, transparent 20%);
    }

    /* Limb darkening effect */
    .sun-body::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 50%,
        rgba(255, 140, 0, 0.1) 70%,
        rgba(255, 100, 0, 0.2) 85%,
        rgba(200, 80, 0, 0.25) 100%);
    }

    /* Soft light rays - diffused beams */
    .sun-rays-soft {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
    }

    .light-beam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 8px;
      background: linear-gradient(to right,
        rgba(255, 240, 200, 0.5) 0%,
        rgba(255, 220, 150, 0.3) 30%,
        rgba(255, 200, 100, 0.1) 70%,
        transparent 100%);
      transform-origin: left center;
      filter: blur(4px);
      opacity: 0.6;
    }

    .light-beam:nth-child(1) { transform: rotate(15deg); }
    .light-beam:nth-child(2) { transform: rotate(55deg); width: 180px; }
    .light-beam:nth-child(3) { transform: rotate(95deg); width: 160px; }
    .light-beam:nth-child(4) { transform: rotate(135deg); }
    .light-beam:nth-child(5) { transform: rotate(175deg); width: 170px; }
    .light-beam:nth-child(6) { transform: rotate(215deg); width: 190px; }
    .light-beam:nth-child(7) { transform: rotate(260deg); width: 150px; }
    .light-beam:nth-child(8) { transform: rotate(305deg); }
    .light-beam:nth-child(9) { transform: rotate(340deg); width: 175px; }

    /* Animations */
    @keyframes hazeBreath {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.7;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 1;
      }
    }

    @keyframes scatterPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 0.8;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05) rotate(2deg);
        opacity: 1;
      }
    }

    @keyframes coronaPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        filter: blur(15px);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.08);
        filter: blur(18px);
      }
    }

    @keyframes bodyGlow {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow:
          0 0 15px rgba(255, 250, 220, 0.95),
          0 0 35px rgba(255, 230, 150, 0.7),
          0 0 70px rgba(255, 200, 100, 0.5),
          0 0 110px rgba(255, 160, 60, 0.35),
          0 0 160px rgba(255, 120, 30, 0.2);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.02);
        box-shadow:
          0 0 20px rgba(255, 250, 220, 1),
          0 0 45px rgba(255, 230, 150, 0.8),
          0 0 90px rgba(255, 200, 100, 0.6),
          0 0 140px rgba(255, 160, 60, 0.4),
          0 0 200px rgba(255, 120, 30, 0.25);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .festival-badge {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, rgba(255, 165, 0, 0.2) 0%, rgba(255, 107, 0, 0.2) 100%);
      border: 1px solid rgba(255, 165, 0, 0.3);
      border-radius: 50px;
      color: #FFD700;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .greeting {
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF6B00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 28px;
      line-height: 1.1;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3B82F6, transparent);
      margin: 0 auto 32px;
    }

    .message {
      font-size: 32px;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1.5;
      margin-bottom: 48px;
      max-width: 95%;
      padding: 0 20px;
    }

    .message p {
      margin-bottom: 16px;
    }

    .highlight {
      color: #60A5FA;
      font-weight: 500;
    }

    .festive-icons {
      font-size: 80px;
      margin: 40px 0;
      letter-spacing: 32px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .logo-section {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo img {
      height: 72px;
      width: auto;
      filter: brightness(1.1);
    }

    .tagline {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
      margin-top: 12px;
      font-weight: 400;
    }

    .website {
      margin-top: 20px;
      font-size: 24px;
      color: #60A5FA;
      text-decoration: none;
      display: inline-block;
      font-weight: 500;
    }

    /* Sesame seeds decoration */
    .seeds {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #FFE4B5;
      border-radius: 50%;
      opacity: 0.4;
    }

    .seed-1 { top: 25%; left: 15%; }
    .seed-2 { top: 40%; right: 12%; }
    .seed-3 { bottom: 35%; left: 10%; }
    .seed-4 { bottom: 25%; right: 15%; }
    .seed-5 { top: 50%; left: 8%; }
    .seed-6 { top: 60%; right: 10%; }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }
      .greeting {
        font-size: 36px;
      }
      .sub-greeting {
        font-size: 22px;
      }
      .kite {
        font-size: 24px;
      }
      .sun {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Natural Sun -->
    <div class="sun-container">
      <div class="sun-haze"></div>
      <div class="sun-scatter"></div>
      <div class="sun-rays-soft">
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
        <div class="light-beam"></div>
      </div>
      <div class="sun-corona"></div>
      <div class="sun-body"></div>
    </div>

    <!-- Decorative elements -->
    <span class="decoration kite kite-1">🪁</span>
    <span class="decoration kite kite-2">🪁</span>
    <span class="decoration kite kite-3">🪁</span>
    <span class="decoration kite kite-4">🪁</span>

    <!-- Sesame seeds -->
    <span class="seeds seed-1"></span>
    <span class="seeds seed-2"></span>
    <span class="seeds seed-3"></span>
    <span class="seeds seed-4"></span>
    <span class="seeds seed-5"></span>
    <span class="seeds seed-6"></span>

    <!-- Content -->
    <div class="festival-badge">Makar Sankranti 2025</div>

    <h1 class="greeting">Happy Sankranti!</h1>

    <div class="divider"></div>

    <div class="message">
      <p>
        As the sun begins its <span class="highlight">northward journey</span>, may this harvest season bring you warmth, prosperity, and new beginnings!
      </p>
    </div>

    <!-- Festive emojis -->
    <div class="festive-icons">
      🪁 ☀️ 🌾
    </div>

    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo">
        <img src="/logo/navbar-logo.svg" alt="Somatiq Logo">
      </div>
      <p class="tagline">Intelligent RIS-PACS for Radiology</p>
      <a href="https://somatiq.ai" class="website">somatiq.ai</a>
    </div>
  </div>
</body>
</html>
